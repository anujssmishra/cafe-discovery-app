{% extends 'base.html' %}

{% block title %}Edit Visit to {{ visit.cafe.name }} · Café Discovery{% endblock %}

{% block content %}
<div class="shell">
  <div class="form-panel" style="max-width: 600px; margin: 2rem auto;">
    <h2>Edit Visit to {{ visit.cafe.name }}</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div style="display: flex; gap: 1rem; align-items: center; margin-top: 1rem;">
        <button class="button button-primary" type="submit">Save changes</button>
        <a href="{% url 'members:visits' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
