# Local synthetic development only. No production services or credentials.
name: cafe-catalogue-local
services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql.Dockerfile
    environment:
      MYSQL_DATABASE: cafe_discovery
      MYSQL_USER: cafe
      MYSQL_PASSWORD: local-demo-only
      MYSQL_ROOT_PASSWORD: local-root-only
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -plocal-root-only]
      interval: 3s
      timeout: 3s
      retries: 40
  app:
    build: .
    environment:
      APP_ENV: development
      DEMO_MODE: 'true'
      APP_BASE_PATH: ''
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: cafe_discovery
      DB_USER: cafe
      DB_PASS: local-demo-only
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      mysql:
        condition: service_healthy
    command: [php, -S, '0.0.0.0:8000', -t, php_app/public, php_app/public/router.php]
  test:
    build: .
    profiles: [test]
    environment:
      APP_ENV: test
      DEMO_MODE: 'true'
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: cafe_discovery_test
      DB_USER: cafe
      DB_PASS: local-demo-only
    depends_on:
      mysql:
        condition: service_healthy
    command: [php, php_app/tests/integration.php, --allow-reset]
  apache:
    build:
      context: .
      dockerfile: docker/apache.Dockerfile
    profiles: [routing]
    environment:
      APP_ENV: development
      DEMO_MODE: 'true'
      APP_BASE_PATH: /guide
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: cafe_discovery
      DB_USER: cafe
      DB_PASS: local-demo-only
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:
