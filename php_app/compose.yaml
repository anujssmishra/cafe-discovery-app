# Local synthetic development only. No production services or credentials.
name: cafe-catalogue-mariadb-local
services:
  mariadb:
    build:
      context: .
      dockerfile: docker/mariadb.Dockerfile
    environment:
      MARIADB_DATABASE: cafe_discovery
      MARIADB_USER: cafe
      MARIADB_PASSWORD: local-demo-only
      MARIADB_ROOT_PASSWORD: local-root-only
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 40
  app:
    build: .
    environment:
      APP_ENV: development
      DEMO_MODE: 'true'
      APP_BASE_PATH: ''
      DB_HOST: mariadb
      DB_PORT: '3306'
      DB_NAME: cafe_discovery
      DB_USER: cafe
      DB_PASS: local-demo-only
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      mariadb:
        condition: service_healthy
    command: [php, -S, '0.0.0.0:8000', -t, php_app/public, php_app/public/router.php]
  test:
    build: .
    profiles: [test]
    environment:
      APP_ENV: test
      DEMO_MODE: 'true'
      DB_HOST: mariadb
      DB_PORT: '3306'
      DB_NAME: cafe_discovery_test
      DB_USER: cafe
      DB_PASS: local-demo-only
    depends_on:
      mariadb:
        condition: service_healthy
    command: [php, php_app/tests/integration.php, --allow-reset]
  apache:
    build:
      context: .
      dockerfile: docker/apache.Dockerfile
    profiles: [routing]
    environment:
      APP_ENV: development
      DEMO_MODE: 'true'
      APP_BASE_PATH: /guide
      DB_HOST: mariadb
      DB_PORT: '3306'
      DB_NAME: cafe_discovery
      DB_USER: cafe
      DB_PASS: local-demo-only
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      mariadb:
        condition: service_healthy
  hosting:
    build:
      context: .
      dockerfile: docker/hostinger.Dockerfile
    profiles: [hosting]
    ports:
      - '127.0.0.1:8081:80'
    depends_on:
      mariadb:
        condition: service_healthy
volumes:
  mariadb-data:
