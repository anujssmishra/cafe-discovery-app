# Local routing verification only. Serve public files and a /guide alias.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /app/php_app/public
    Alias /guide /app/php_app/public
    <Directory /app/php_app/public>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>
</VirtualHost>
