<VirtualHost *:80>
    ServerName myfanverse.in
    DocumentRoot /app/release/public_html
    <Directory /app/release/public_html>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>
</VirtualHost>
<VirtualHost *:80>
    ServerName cafes.myfanverse.in
    DocumentRoot /app/release/public_html/cafes
    <Directory /app/release/public_html/cafes>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>
</VirtualHost>
