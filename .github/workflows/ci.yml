name: Catalogue checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cafe_discovery_test
          MYSQL_USER: cafe
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-root-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DEMO_MODE: 'true'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: cafe_discovery_test
      DB_USER: cafe
      DB_PASS: ci-only-password
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none
      - name: Lint PHP files
        run: php php_app/scripts/lint.php
      - name: Unit checks
        run: php php_app/tests/unit.php
      - name: MySQL integration and HTTP checks
        run: php php_app/tests/integration.php --allow-reset
