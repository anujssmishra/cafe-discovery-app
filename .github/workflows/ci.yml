name: Catalogue checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        run: |
          if [ -d "php_app" ]; then
            find php_app -type f -name "*.php" -exec php -l {} \;
          else
            echo "No PHP files to lint yet."
          fi
