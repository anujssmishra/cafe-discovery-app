version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: food_recsys_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: food_recsys
      POSTGRES_USER: recsys
      POSTGRES_PASSWORD: recsys_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recsys -d food_recsys"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: food_recsys_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://recsys:recsys_password@db:5432/food_recsys
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
