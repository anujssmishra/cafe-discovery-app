{% extends 'base.html' %}

{% block title %}Reset Password · Café Discovery{% endblock %}

{% block content %}
<div class="shell">
  <div class="form-panel" style="max-width: 400px; margin: 2rem auto;">
    <h2>Reset Password</h2>
    <p>Forgotten your password? Enter your email address below, and we'll email instructions for setting a new one.</p>
    
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="button button-primary" type="submit">Send instructions</button>
    </form>
  </div>
</div>
{% endblock %}
