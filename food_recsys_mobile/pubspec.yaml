name: food_recsys_mobile
description: "Food RecSys: Spotify for Food. Personalized dining recommendations powered by real UPI spending habits."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  provider: ^6.1.2
  telephony:
    path: ./packages/telephony
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
